name: Claim Daily Reward

on:
    schedule:
        - cron: '0 21 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    daily-claim:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: setup uv (python)
              id: setup-uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "latest"
                  python-version: 3.13
                  enable-cache: true
                  activate-environment: true

            - name: Install dependencies
              run: |
                  uv sync

            - name: Run daily claim script
              env:
                  HOYO_API_URL: "${{ vars.HOYO_API_URL || 'https://hoyo-api.haiueom.workers.dev' }}"
                  HOYO_API_KEY: ${{ secrets.HOYO_API_KEY }}
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '5' }}
                  LOCALE: ${{ vars.LOCALE || 'en-us' }}
                  NO_GENSHIN: ${{ vars.NO_GENSHIN || 'False' }}
                  NO_STARRAIL: ${{ vars.NO_STARRAIL || 'False' }}
                  NO_ZZZ: ${{ vars.NO_ZZZ || 'False' }}
                  NO_HONKAI: ${{ vars.NO_HONKAI || 'False' }}
                  NO_TOT: ${{ vars.NO_TOT || 'True' }}
              run: uv run main.py
